<main class="auth-layout">
  <app-auth-brand />

  <section class="auth-panel">
    <div class="auth-form-wrap animate-in">
      <div class="auth-mobile-brand d-flex align-items-center gap-2">
        <span class="brand-mark"><i class="bi bi-check2-square" aria-hidden="true"></i></span>
        <span class="brand-name">Task Management System</span>
      </div>

      <span class="icon-tile mb-3"><i class="bi bi-key" aria-hidden="true"></i></span>
      <h1 class="auth-title">Forgot your password?</h1>
      <p class="auth-subtitle fs-sm">Enter your account email and we'll send you a secure link to reset it.</p>

      @if (confirmation(); as message) {
        <div class="alert alert-success border-success" role="status" data-testid="forgot-confirmation">
          <i class="bi bi-envelope-check-fill" aria-hidden="true"></i><span>{{ message }}</span>
        </div>
      } @else {
        @if (error(); as message) {
          <div class="alert alert-danger border-danger" role="alert">
            <i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i><span>{{ message }}</span>
          </div>
        }
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="mb-4">
            <label for="email" class="form-label">Email</label>
            <div class="input-icon">
              <i class="bi bi-envelope" aria-hidden="true"></i>
              <input
                id="email"
                type="email"
                class="form-control"
                formControlName="email"
                placeholder="you@company.com"
                autocomplete="email"
                required
                [class.is-invalid]="emailInvalid"
                [attr.aria-invalid]="emailInvalid"
                aria-describedby="emailError"
              />
            </div>
            @if (emailInvalid) {
              <div id="emailError" class="invalid-feedback d-block">
                <i class="bi bi-exclamation-circle me-1" aria-hidden="true"></i>Enter a valid email address.
              </div>
            }
          </div>
          <button type="submit" class="btn btn-gradient w-100" [disabled]="submitting()">
            @if (submitting()) {
              <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              <span role="status">Sending…</span>
            } @else {
              Send reset link <i class="bi bi-send ms-1" aria-hidden="true"></i>
            }
          </button>
        </form>
      }

      <p class="text-center mt-4 mb-0 fs-sm">
        <a routerLink="/login" class="text-decoration-none fw-medium"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back to sign in</a>
      </p>
    </div>
  </section>
</main>

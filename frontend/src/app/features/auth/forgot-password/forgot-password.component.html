<main class="auth-page d-flex align-items-center bg-body-tertiary py-4">
  <div class="container">
    <div class="auth-card card shadow-sm border-0 mx-auto">
      <div class="card-body p-4 p-sm-5">
        <h1 class="h4 mb-1">Forgot your password?</h1>
        <p class="text-body-secondary mb-4">Enter your account email and we'll send you a link to reset it.</p>

        @if (confirmation(); as message) {
          <div class="alert alert-success" role="status" data-testid="forgot-confirmation">{{ message }}</div>
        } @else {
          @if (error(); as message) {
            <div class="alert alert-danger" role="alert">{{ message }}</div>
          }
          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="mb-4">
              <label for="email" class="form-label">Email</label>
              <input
                id="email"
                type="email"
                class="form-control"
                formControlName="email"
                autocomplete="email"
                required
                [class.is-invalid]="emailInvalid"
                [attr.aria-invalid]="emailInvalid"
                aria-describedby="emailError"
              />
              @if (emailInvalid) {
                <div id="emailError" class="invalid-feedback d-block">Enter a valid email address.</div>
              }
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
              @if (submitting()) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                <span role="status">Sending…</span>
              } @else {
                Send reset link
              }
            </button>
          </form>
        }

        <p class="text-center mt-4 mb-0"><a routerLink="/login">Back to sign in</a></p>
      </div>
    </div>
  </div>
</main>
